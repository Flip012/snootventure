name: Deploy to GitHub Pages

# Builds the Vite site on every push and deploys it to the `gh-pages` branch
# under a per-branch subdirectory, so multiple work branches are testable in
# parallel. A root index.html lists all deployed branches.

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (per-branch base path)
        env:
          # Project Pages serve at https://<owner>.github.io/<repo>/, so assets
          # must resolve under /<repo>/<branch>/ or nothing loads.
          VITE_BASE: /${{ github.event.repository.name }}/${{ github.ref_name }}/
        run: npm run build

      - name: Deploy branch build to gh-pages/<branch>/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      - name: Check out gh-pages to refresh the branch index
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate root branch index
        run: node scripts/gen-index.mjs gh-pages

      - name: Commit and push updated index
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Branch index unchanged."
          else
            git commit -m "chore: update branch index"
            git push
          fi
